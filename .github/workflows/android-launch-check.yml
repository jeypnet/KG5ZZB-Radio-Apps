name: Android launch check

# Started by hand only. Installs an Android APK on the Android emulator, starts it, opens the
# demo and every screen, and saves screenshots and the log (logcat). Fails if the app stops.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the APK to test (or a release tag, for a draft release in this repository)"
        required: true

permissions:
  contents: write

jobs:
  launch:
    name: Android ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download the APK
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ inputs.url }}
        run: |
          case "$SRC" in
            http*) curl -sSL -o app.apk "$SRC" ;;
            *) gh release download "$SRC" -R "$GITHUB_REPOSITORY" --pattern "*.apk" --output app.apk ;;
          esac
          ls -l app.apk
      - name: Test helper
        run: |
          cat > tap.py <<'EOF'
          import re, subprocess, sys
          subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/ui.xml"], capture_output=True)
          xml = subprocess.run(["adb", "shell", "cat", "/sdcard/ui.xml"], capture_output=True, text=True).stdout
          for text in sys.argv[1:]:
              for m in re.finditer(r'<node [^>]*?text="([^"]*)"[^>]*?bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml):
                  t = m.group(1).strip().lower()
                  if (t.find(text[1:].lower()) >= 0) if text.startswith("~") else (t == text.lower()):
                      x = (int(m.group(2)) + int(m.group(4))) // 2
                      y = (int(m.group(3)) + int(m.group(5))) // 2
                      subprocess.run(["adb", "shell", "input", "tap", str(x), str(y)])
                      print(f"tapped '{text}' at {x},{y}")
                      sys.exit(0)
          print(f"NOT FOUND: {sys.argv[1:]}")
          print(re.findall(r'text="([^"]+)"', xml))
          sys.exit(1)
          EOF
          cat > absent.py <<'EOF'
          import subprocess, sys
          subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/ui.xml"], capture_output=True)
          xml = subprocess.run(["adb", "shell", "cat", "/sdcard/ui.xml"], capture_output=True, text=True).stdout
          bad = [t for t in sys.argv[1:] if t.lower() in xml.lower()]
          print(("FAIL: shown: " + ", ".join(bad)) if bad else "OK: not shown: " + ", ".join(sys.argv[1:]))
          sys.exit(1 if bad else 0)
          EOF
          cat > check.sh <<'EOF'
          #!/bin/bash
          # $1 = step name. Screenshot, then fail if the app is gone.
          sleep 2
          adb exec-out screencap -p > "shot-$API-$1.png"
          if adb shell pidof com.kg5zzb.airband >/dev/null; then echo "OK: app running after $1"; else
            echo "FAIL: app stopped after $1"; adb logcat -d > "logcat-$API.txt"
            grep -A30 "FATAL EXCEPTION" "logcat-$API.txt" | head -60; exit 1; fi
          EOF
          chmod +x check.sh
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            adb shell dumpsys package com.kg5zzb.airband | grep -m1 versionName
            adb logcat -c
            adb shell monkey -p com.kg5zzb.airband -c android.intent.category.LAUNCHER 1
            sleep 15
            ./check.sh 1-start
            python3 tap.py "Search for a city"
            sleep 2
            python3 tap.py "Or type a city" || true
            adb shell input text Chicago
            sleep 3
            python3 tap.py "Chicago, Illinois, United States"
            sleep 5
            ./check.sh 1b-city-chosen
            python3 tap.py "Try the demo"
            sleep 30
            ./check.sh 2-demo-listen
            python3 tap.py "Map"
            sleep 15
            ./check.sh 3-map
            python3 tap.py "Messages"
            sleep 15
            ./check.sh 4-messages
            python3 absent.py "in the full version" "Get the full version"
            python3 tap.py "Listen"
            sleep 10
            ./check.sh 5-listen-again
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell monkey -p com.kg5zzb.airband -c android.intent.category.LAUNCHER 1
            sleep 10
            ./check.sh 6-reopen
            adb shell pm grant com.kg5zzb.airband android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm grant com.kg5zzb.airband android.permission.ACCESS_FINE_LOCATION || true
            adb emu geo fix -95.36 29.76
            python3 tap.py "⋮"
            sleep 2
            python3 tap.py "Change location"
            sleep 2
            python3 tap.py "~Use my location"
            sleep 8
            ./check.sh 7-my-location
            adb logcat -d > logcat-$API.txt
            ! grep -q "FATAL EXCEPTION" logcat-$API.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-${{ matrix.api }}
          retention-days: 1
          path: |
            shot-*.png
            logcat-*.txt
